name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[test]
      - run: pytest -q
      - name: Sample report is reproducible
        run: |
          python tools/make_sample.py
          git diff --exit-code examples/
          csaf-match examples/advisories -i examples/inventory.csv -a examples/aliases.csv -o /tmp/report.md
          diff -u docs/sample-report.md /tmp/report.md
