[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csaf-asset-matcher"
version = "0.4.0"
description = "Match CSAF 2.0 security advisories against an asset inventory, including OT version ranges"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Arafat Malik"}]
requires-python = ">=3.9"
dependencies = []
keywords = ["csaf", "vex", "vulnerability", "ics", "ot", "asset-inventory"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
csaf-match = "csafmatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
